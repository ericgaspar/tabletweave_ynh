#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "tabletweave"
name = "Tabletweave"
description.en = "Tool for designing tablet weaving drafts"
description.fr = "Outil de conception de schémas de tissage sur tablette"

version = "1.7.1~ynh1"

maintainers = [ ]

[upstream]
license = "free"
demo = "http://bazzalisk.org/tabletweave/"
code = "https://github.com/jamespbarrett/tabletweave"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/tabletweave"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/jamespbarrett/tabletweave/archive/refs/tags/1.7.1.tar.gz"
    sha256 = "f1c29624655d5ba3a67a543abc5344111958aa1861a1bdf8f77d28fdcbb6561c"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
